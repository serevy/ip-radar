name: Live Semantic Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model ID for this evaluation"
        required: true
        default: "gpt-5.6-luna"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-evaluation
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IP_RADAR_LIVE_MODEL: ${{ inputs.model }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install IP Radar
        run: python -m pip install -e .

      - name: Require API key
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured for the live-evaluation environment"
            exit 1
          fi

      - name: Run live semantic evaluation
        run: python scripts/live_semantic_eval.py

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@330a01c49091a8c3e782c0c6c4c9a9c679ccece6 # v4
        with:
          name: live-semantic-eval-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
